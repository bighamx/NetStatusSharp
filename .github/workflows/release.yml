name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained application
        run: >-
          dotnet publish NetStatusSharp/NetStatusSharp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output publish/win-x64

      - name: Package release files
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $staging = Join-Path $env:RUNNER_TEMP "NetStatusSharp-$tag"
          $asset = Join-Path $env:RUNNER_TEMP "NetStatusSharp-$tag.zip"
          $releaseDir = "publish\win-x64"
          $requiredFiles = @("NetStatusSharp.exe")

          New-Item -ItemType Directory -Force -Path $staging | Out-Null

          foreach ($file in $requiredFiles) {
            $path = Join-Path $releaseDir $file
            if (-not (Test-Path $path)) {
              throw "Required release file not found: $path"
            }
          }

          Copy-Item -Path (Join-Path $releaseDir "*") -Destination $staging -Recurse -Force

          if (Test-Path $asset) {
            Remove-Item -LiteralPath $asset -Force
          }

          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $asset
          "ASSET_PATH=$asset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET_PATH }}
          generate_release_notes: true
